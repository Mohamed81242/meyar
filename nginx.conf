###############################################################################
# Nota Dashboard — Production Nginx Configuration
#
# Optimized for React SPAs with client-side routing (React Router),
# Gzip compression, and production caching headers.
###############################################################################

server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    charset utf-8;

    # ── Security headers ────────────────────────────────────────────────────
    add_header X-Frame-Options        "SAMEORIGIN"                      always;
    add_header X-Content-Type-Options "nosniff"                         always;
    add_header Referrer-Policy        "strict-origin-when-cross-origin" always;

    # ── Gzip ────────────────────────────────────────────────────────────────
    gzip on;
    gzip_comp_level 5;
    gzip_min_length 256;
    gzip_proxied any;
    gzip_types
        application/json
        application/javascript
        application/xml
        text/css
        text/plain
        text/xml
        image/svg+xml;

    # ── Static assets caching ───────────────────────────────────────────────
    # Cache assets built with hashed filenames (Vite output files)
    location /assets {
        expires max;
        access_log off;
        add_header Cache-Control "public, immutable";
    }

    # Cache generic static assets (images, icons, etc.)
    location ~* \.(ico|css|js|gif|jpeg|jpg|png|webp|woff2?|svg|ttf|eot)$ {
        expires 30d;
        access_log off;
        add_header Cache-Control "public";
        try_files $uri =404;
    }

    # ── Backend API Proxy ───────────────────────────────────────────────────
    location /api/ {
        proxy_pass ${BACKEND_API_URL};
        proxy_http_version 1.1;
        proxy_ssl_server_name on;
        proxy_set_header Host $proxy_host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # ── React Router Fallback ───────────────────────────────────────────────
    # Route all requests to index.html for client-side routing
    location / {
        try_files $uri $uri/ /index.html;
    }

    location = /favicon.ico { access_log off; log_not_found off; }
    location = /robots.txt  { access_log off; log_not_found off; }

    # ── Deny dotfiles ───────────────────────────────────────────────────────
    location ~ /\.(?!well-known) {
        deny all;
    }
}
